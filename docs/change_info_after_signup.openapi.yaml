openapi: 3.0.3
info:
    title: MERCARI API
    version: '1.0'
paths:
    /api/it4788/change_info_after_signup:
        post:
            summary: Change info after signup
            requestBody:
                required: true
                content:
                    multipart/form-data:
                        schema:
                            type: object
                            required:
                                - avatar
                            properties:
                                token:
                                    type: string
                                    nullable: true
                                    description: Optional in the request schema, but the current auth flow still needs a valid token to resolve the user.
                                username:
                                    type: string
                                height:
                                    type: string
                                avatar:
                                    type: string
                                    format: binary
            responses:
                '200':
                    description: Successful response
                    content:
                        application/json:
                            schema:
                                type: object
                                required:
                                    - code
                                    - message
                                    - data
                                properties:
                                    code:
                                        type: string
                                    message:
                                        type: string
                                    data:
                                        type: object
                                        required:
                                            - id
                                            - username
                                            - phonenumber
                                            - created
                                            - avatar
                                        properties:
                                            id:
                                                type: string
                                            username:
                                                type: string
                                            phonenumber:
                                                type: string
                                            created:
                                                type: string
                                            avatar:
                                                type: string
