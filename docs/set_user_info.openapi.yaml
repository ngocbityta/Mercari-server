openapi: 3.0.3
info:
    title: MERCARI API
    version: '1.0'
paths:
    /api/set_user_info:
        post:
            summary: Save user info
            requestBody:
                required: true
                content:
                    multipart/form-data:
                        schema:
                            type: object
                            required:
                                - token
                            properties:
                                token:
                                    type: string
                                username:
                                    type: string
                                avatar:
                                    type: string
                                    format: binary
                                cover_image:
                                    type: string
                                    format: binary
            responses:
                '200':
                    description: Successful response
                    content:
                        application/json:
                            schema:
                                type: object
                                required:
                                    - code
                                    - message
                                    - data
                                properties:
                                    code:
                                        type: string
                                    message:
                                        type: string
                                    data:
                                        type: object
                                        required:
                                            - avatar
                                            - id
                                            - cover_image
                                            - username
                                        properties:
                                            avatar:
                                                type: string
                                            id:
                                                type: string
                                            cover_image:
                                                type: string
                                            username:
                                                type: string
