services:
  group1-backend:
    image: ghcr.io/ngocbityta/mercari-server:${IMAGE_TAG}
    restart: unless-stopped
    env_file:
      - .env.prod
    command: sh -c "npx prisma migrate deploy && node dist/src/main.js"
    depends_on:
      group1-db:
        condition: service_healthy
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.group1-backend.rule=Host(`group1.it4788.sukkaito.id.vn`)"
      - "traefik.http.routers.group1-backend.entrypoints=websecure"
      - "traefik.http.routers.group1-backend.tls=true"
      - "traefik.http.routers.group1-backend.tls.certresolver=letsencrypt"
    networks:
      - proxy-net
    deploy:
      resources:
        limits:
          memory: 512M
  
  group1-db:
    container_name: group1-db
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      - POSTGRES_USER=prisma
      - POSTGRES_PASSWORD=prisma
      - POSTGRES_DB=postgres
    volumes:
      - ./pgdata:/var/lib/postgresql/data
    networks:
      - proxy-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U prisma -d postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.10.2
    container_name: elasticsearch
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - "ES_JAVA_OPTS=-Xms512m -Xmx512m"
    ports:
      - "9200:9200"
    networks:
      - proxy-net
    deploy:
      resources:
        limits:
          memory: 1G

networks:
  proxy-net:
    external: true
